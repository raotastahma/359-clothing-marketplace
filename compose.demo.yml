name: portfolio-359-demo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio_demo
      POSTGRES_USER: portfolio_demo
      POSTGRES_PASSWORD: ${DEMO_DATABASE_PASSWORD:?Set DEMO_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_demo -d portfolio_demo"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
volumes:
  demo_postgres:
