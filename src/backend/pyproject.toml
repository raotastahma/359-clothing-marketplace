[project]
name = "threefivenine-backend"
version = "0.1.0"
description = "359 Marketplace API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic>=2.0",
    "pydantic-settings",
    "redis",
    "celery[redis]",
    "bcrypt",
    "python-multipart",
    "boto3",
    "httpx",
    "beartype",
    "yookassa>=3.10.0",
    "pyjwt[crypto]>=2.10.1",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B008", "E402", "E501", "N803", "N811", "SIM105", "SIM108", "SIM117", "UP042"]

[tool.pytest.ini_options]
pythonpath = ["."]
